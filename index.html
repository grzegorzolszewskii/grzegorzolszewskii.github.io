<style>
  :root{
    --bg: #1A1C1F;
    --bg-alt: #212327;
    --border: #34363C;
    --text: #E8EAEC;
    --text-muted: #999FA6;
    --accent: #5E86A6;
    --accent-dim: #3F5A70;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  ::selection{background:var(--accent-dim);}

  header.site{display:flex;justify-content:space-between;align-items:center;padding:1.6rem 3rem;}
  header.site .name{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:500;}
  header.site nav ul{display:flex;gap:2rem;list-style:none;font-size:0.9rem;color:var(--text-muted);}
  header.site nav a{text-decoration:none;}
  header.site nav a:hover{color:var(--accent);}

  .split{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 76px);}

  .split-left{display:flex;align-items:center;padding:3rem 4rem;}
  .split-left-inner{max-width:420px;width:100%;}
  .split-left-inner h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(1.7rem,2.8vw,2.3rem);line-height:1.35;margin-bottom:2.6rem;}

  .tile-grid{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
  .tile-grid a{aspect-ratio:1;background:var(--bg-alt);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.9rem;text-decoration:none;color:inherit;transition:border-color 0.15s ease;}
  .tile-grid a:hover{border-color:var(--accent);}
  .tile-grid .icon{width:30px;height:30px;color:var(--accent);}
  .tile-grid .icon svg{width:100%;height:100%;display:block;}
  .tile-grid .label{font-family:'Fraunces',serif;font-weight:500;font-size:1.05rem;text-align:center;padding:0 0.6rem;}

  .split-right{position:relative;overflow:hidden;background:var(--bg-alt);}
  .split-right img{width:100%;height:100%;object-fit:cover;display:block;}

  @media (max-width: 800px){
    .split{grid-template-columns:1fr;}
    .split-left{padding:2.5rem 1.5rem;}
    .split-right{height:52vh;}
  }

  footer.site{padding:2.4rem 3rem;color:var(--text-muted);font-size:0.85rem;border-top:1px solid var(--border);display:flex;gap:1.2rem;flex-wrap:wrap;}
</style>
</head>
<body>

                <path d="M22 5c-2-1-5-1-7 0v14c2-1 5-1 7 0V5z"/>

        </li>

                <polyline points="8 6 3 12 8 18"/>
                <polyline points="16 6 21 12 16 18"/>
              </svg>
            </span>
            <span class="label">Programowanie</span>
          </a>
        </li>
        <li>
          <a href="#">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>

              </svg>

        <li>

      </ul>
    </div>

  <div class="split-right">
    <img src="https://i.pravatar.cc/900?img=47" alt="Zdjęcie profilowe — Julia Wiśniewska">
  </div>
</div>

<footer class="site">
  <span>julia@przyklad.pl</span>
  <span>LinkedIn</span>
  <span>GitHub</span>
</footer>

</body>
</html>
